# Documentation site (feature 010): build on pull requests that touch the site, build and
# deploy to GitHub Pages on pushes to main. Pages uses the "GitHub Actions" source.
name: Docs site

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/parity.md"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/parity.md"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Check (types, screenshot coverage)
        working-directory: site
        run: npm run check
      - name: Build (internal links validated)
        working-directory: site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
